<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets content reach notch edges; CSS uses env() for safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="ARISE – Rise as a Hunter. Level up your life.">

  <!-- PWA / home-screen install hints -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARISE">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="stylesheet" href="css/style.css">
  <title>ARISE</title>
</head>
<body>

  <div id="app">

    <!-- ══ PIN LOCK (shown only when PIN is set) ══════════════════════ -->
    <div id="pin-screen" class="pin-screen hidden"
         role="dialog" aria-modal="true" aria-label="PIN Authentication">
      <div class="panel pin-panel panel-cut">
        <div class="system-label">[SYSTEM] AUTHENTICATION REQUIRED</div>
        <div id="pin-display" class="pin-display" aria-live="polite">● ● ● ●</div>
        <div class="pin-pad" id="pin-pad" role="group" aria-label="PIN keypad"></div>
      </div>
    </div>

    <!-- ══ MAIN SCREEN (router swaps inner HTML) ══════════════════════ -->
    <main id="screen-content" class="screen-content" role="main"></main>

    <!-- ══ TOAST LAYER ════════════════════════════════════════════════ -->
    <div id="toast-container" class="toast-container"
         aria-live="polite" aria-atomic="true"></div>

    <!-- ══ MODAL OVERLAY ══════════════════════════════════════════════ -->
    <div id="modal-overlay" class="modal-overlay hidden"
         role="dialog" aria-modal="true" aria-labelledby="modal-title-text">
      <div id="modal-box" class="modal-box"></div>
    </div>

    <!-- ══ BOTTOM NAV (5 tabs) ════════════════════════════════════════ -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">

      <button class="nav-btn active" data-tab="status"
              aria-label="Status" aria-current="page">
        <!-- Status: 2×2 grid icon -->
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Status</span>
      </button>

      <button class="nav-btn" data-tab="quests" aria-label="Quests">
        <!-- Checkmark + clipboard -->
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
        <span>Quests</span>
      </button>

      <button class="nav-btn" data-tab="train" aria-label="Train">
        <!-- Dumbbell / barbell -->
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16"/>
          <circle cx="4"  cy="6.5"  r="1.5"/>
          <circle cx="20" cy="6.5"  r="1.5"/>
          <circle cx="4"  cy="17.5" r="1.5"/>
          <circle cx="20" cy="17.5" r="1.5"/>
        </svg>
        <span>Train</span>
      </button>

      <button class="nav-btn" data-tab="study" aria-label="Study">
        <!-- Open book -->
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
        </svg>
        <span>Study</span>
      </button>

      <button class="nav-btn" data-tab="spirit" aria-label="Spirit">
        <!-- Star / spirit symbol -->
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77
                   l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span>Spirit</span>
      </button>

    </nav>
  </div><!-- /#app -->

  <!-- ES module; browser won't block render on this -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
