<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#05070d"/>

  <!-- Outer hexagonal gate frame -->
  <polygon points="256,22 468,138 468,374 256,490 44,374 44,138"
           fill="none" stroke="#1e3a5f" stroke-width="4"/>

  <!-- Inner panel fill -->
  <polygon points="256,58 432,160 432,352 256,454 80,352 80,160"
           fill="#0b1220"/>

  <!-- Glowing inner frame -->
  <polygon points="256,58 432,160 432,352 256,454 80,352 80,160"
           fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>

  <!-- The "A" letterform — ARISE -->
  <path d="M165,370 L256,118 L347,370"
        fill="none" stroke="#38bdf8" stroke-width="30"
        stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Crossbar -->
  <line x1="203" y1="282" x2="309" y2="282"
        stroke="#38bdf8" stroke-width="22" stroke-linecap="square"/>
  <!-- Inner fill to make A solid-looking -->
  <path d="M205,345 L256,165 L307,345 Z"
        fill="#0b1220"/>
  <line x1="210" y1="282" x2="302" y2="282"
        stroke="#0b1220" stroke-width="10"/>

  <!-- Rising gold arrow above the A peak -->
  <line x1="256" y1="105" x2="256" y2="46"
        stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
  <polyline points="232,70 256,46 280,70"
            fill="none" stroke="#fbbf24" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertex glow dots -->
  <circle cx="256" cy="22"  r="5" fill="#38bdf8"/>
  <circle cx="468" cy="138" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="468" cy="374" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="256" cy="490" r="5" fill="#38bdf8"/>
  <circle cx="44"  cy="374" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="44"  cy="138" r="4" fill="#38bdf8" opacity="0.6"/>
</svg>
